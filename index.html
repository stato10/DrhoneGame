<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>סוכן צללים · SHADOW AGENT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020607;color:#d8fff6;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100svh}button{font:inherit;color:inherit;background:#071b1c;border:1px solid #2d7068;border-radius:8px;padding:12px 18px;cursor:pointer}button:focus-visible{outline:3px solid #ffcf67;outline-offset:4px}button:hover{background:#123332}main{width:min(100vw,600px);height:min(100vw,600px);min-height:460px;position:relative;overflow:hidden;background:#000;border:1px solid #163333;padding:26px;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:1}header{font-size:13px;letter-spacing:2px;color:#69d8c1;direction:ltr}#clock{color:#ffcf67;font-size:24px;font-variant-numeric:tabular-nums}#view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}h1{font-size:46px;margin:8px 0 12px}h2{font-size:29px;margin:8px 0}p{font-size:18px;line-height:1.55;max-width:440px;margin:9px 0}small{font-size:12px;color:#7aa69d}#art{width:240px;height:210px}#art svg{width:100%;height:100%;overflow:visible}#controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}footer{font-size:12px;color:#83aea5}footer button{font-size:12px;padding:8px}#progress{height:3px;background:#123831;margin:18px 0 0}#progress i{display:block;background:#79ffdb;height:100%;width:0;transition:width .15s}#badge{color:#ffcf67;font-size:13px;letter-spacing:2px}#note{min-height:22px;font-size:14px;color:#ffcf67;margin:5px 0}.big{font-size:54px;color:#8dffe0;font-variant-numeric:tabular-nums}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#14342833 1px,transparent 1px),linear-gradient(90deg,#14342833 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse,#0005,transparent 70%)}@media(max-width:480px){main{padding:18px;height:100svh;max-height:600px}h1{font-size:36px}p{font-size:16px}#art{height:180px;width:210px}button{padding:10px 14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main><div class="grid"></div><header><span>SHADOW / AGENT</span><span id="clock">02:00</span><span id="score">0000</span></header><div id="progress"><i></i></div><section id="view"></section><footer><span id="sensor">קלט: חצים / Enter</span><button id="sound" aria-label="השתקת צלילים">צליל: פעיל</button><button id="pause" hidden>השהיה</button></footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s),view=$('#view');
let phase='home',remaining=120,score=0,heading=0,target=35,hold=0,ring=0,rings=[105,-135,75],baseline=null,latest=null,sensorAt=0,calibrated=false,paused=false,muted=false,audio=null,last=0,beepAt=0,started=0,dragX=null;
const wrap=x=>((x+180)%360+360)%360-180;
function tone(f=600,d=.08){if(muted||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}
function controls(items){const box=$('#controls');box.replaceChildren();for(const [label,fn]of items){const b=document.createElement('button');b.textContent=label;b.onclick=fn;box.append(b)}box.querySelector('button')?.focus()}
function frame(badge,title,text,art=''){view.innerHTML='<div id="badge"></div><h2></h2><p></p><div id="art"></div><div id="note" role="status"></div><div id="controls"></div>';$('#badge').textContent=badge;$('h2').textContent=title;$('p').textContent=text;$('#art').innerHTML=art;$('#art').hidden=!art}
function home(){phase='home';$('#pause').hidden=true;frame('FIELD OPERATION / 01','סוכן צללים','אות מסתורי. מנעול מוצפן. שתי דקות לצאת.','<svg viewBox="0 0 240 210"><path d="M120 15 200 55 190 140 120 195 50 140 40 55Z" fill="#08211b" stroke="#71ffdc" stroke-width="2"/><path d="m90 100 30-38 30 38-30 53Z" fill="none" stroke="#ffcf67" stroke-width="3"/><circle cx="120" cy="100" r="8" fill="#8dffe0"/></svg>');controls([['משימת רחפן',()=>location.href='drone.html'],['משימות ריגול',start],['כיול ציוד',()=>location.href='calibration.html']]);$('#note').textContent='למשחק בישיבה · חצים ו־Enter · P להשהיה'}
async function start(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch{}try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission()}catch{}remaining=120;score=0;hold=0;heading=0;rings=[105,-135,75];ring=0;paused=false;baseline=latest;calibrated=latest!==null;started=performance.now();$('#pause').hidden=false;$('#pause').textContent='השהיה';setPhase('signal');tone(440,.2)}
function setPhase(p){phase=p;hold=0;if(p==='signal'){frame('01 / SIGNAL','אתר את האות','סובב את הראש בעדינות. החזק את האות במרכז למשך שתי שניות.','<svg viewBox="0 0 240 210"><g fill="none" stroke="#245b4d"><circle cx="120" cy="108" r="90"/><circle cx="120" cy="108" r="60"/><circle cx="120" cy="108" r="30"/><path d="M20 108h200M120 8v200"/></g><path id="beam" d="M120 108 120 18" stroke="#80ffdc" stroke-width="3"/><circle id="dot" r="9" fill="#ffcf67"/><circle cx="120" cy="108" r="5" fill="#80ffdc"/></svg>');controls([['◀ שמאלה',()=>move(-10)],['ימינה ▶',()=>move(10)],['כיול מבט',calibrate]])}if(p==='lock'){frame('02 / DECRYPT','פרוץ את המנעול','סובב כל טבעת אל הסמן העליון, ואז אשר. שלוש טבעות — מנעול אחד.','<svg viewBox="0 0 240 210"><path d="m112 9 8 12 8-12" fill="#ffcf67"/><g id="rings"></g><text x="120" y="115" fill="#b4ffe9" text-anchor="middle" font-size="24" id="ringNumber"></text></svg>');controls([['◀ סובב',()=>move(-15)],['אישור טבעת',confirmRing],['סובב ▶',()=>move(15)]])}if(p==='steady'){baseline=latest;frame('03 / EXTRACTION','עבור את הסריקה','הישאר יציב במשך חמש שניות. תנועה מאפסת את ההתקדמות.','<svg viewBox="0 0 240 210"><path d="M80 190V80q0-30 40-30t40 30v110M100 100v90m40-90v90" fill="none" stroke="#70dec6" stroke-width="3"/><circle cx="120" cy="28" r="20" fill="none" stroke="#70dec6" stroke-width="3"/><path id="scan" d="M30 25h180" stroke="#ffcf67" stroke-width="3"/></svg>');controls([['כיול יציבות',calibrate]]);started=performance.now()}}
function calibrate(){baseline=latest;heading=0;hold=0;calibrated=latest!==null;$('#note').textContent=calibrated?'נקודת האפס עודכנה':'טרם התקבל חיישן — שליטה במקשים זמינה'}
function move(d){if(paused)return;if(phase==='signal')heading=wrap(heading+d);if(phase==='lock')rings[ring]=wrap(rings[ring]+d);if(phase==='steady'){hold=0;$('#note').textContent='זוהתה תנועה — התייצב מחדש'}tone(350,.035)}
function confirmRing(){if(phase!=='lock'||paused)return;if(Math.abs(wrap(rings[ring]))<=8){score+=200;tone(1000,.13);ring++;if(ring===3)setPhase('steady')}else{$('#note').textContent='כמעט. הבא את הפתח אל הסמן העליון';tone(160,.12)}}
function finish(win){phase=win?'win':'lost';$('#pause').hidden=true;let best=0;try{best=Number(localStorage.getItem('shadow-agent-best'))||0;if(win){score+=Math.floor(remaining)*10;best=Math.max(best,score);localStorage.setItem('shadow-agent-best',best)}}catch{}frame(win?'MISSION COMPLETE':'SIGNAL LOST',win?'המשימה הושלמה':'הזמן אזל',win?'האות פוענח. הזהות נשארה חסויה.':'הסוכן הבא הוא שוב אתה. נסה מסלול חדש.','<div class="big">'+score+'</div><p>שיא אישי: '+best+'</p>');controls([['משימה נוספת',start]]);tone(win?1000:180,.35)}
function togglePause(){if(!['signal','lock','steady'].includes(phase))return;paused=!paused;$('#pause').textContent=paused?'המשך':'השהיה';$('#note').textContent=paused?'המשימה מושהית':'';last=performance.now()}
window.addEventListener('deviceorientation',e=>{if(!Number.isFinite(e.alpha)||!Number.isFinite(e.beta))return;latest={a:e.alpha,b:e.beta};sensorAt=performance.now();if(!calibrated){baseline=latest;calibrated=true}if(phase==='signal'&&!paused&&baseline)heading=wrap(latest.a-baseline.a)});
function tick(now){const elapsed=(now-(last||now))/1000;const dt=Math.min(elapsed,.1);last=now;const active=['signal','lock','steady'].includes(phase);const live=latest!==null&&now-sensorAt<1200;$('#sensor').textContent=live?'קלט: חיישן כיוון + חצים':'קלט: חצים / Enter · אין חיישן פעיל';if(active&&!paused){remaining=Math.max(0,remaining-elapsed);if(!remaining)finish(false);else if(phase==='signal'){const error=Math.abs(wrap(target-heading));hold=error<12?hold+dt:0;const angle=(target-heading-90)*Math.PI/180;$('#dot').setAttribute('cx',120+Math.cos(angle)*73);$('#dot').setAttribute('cy',108+Math.sin(angle)*73);$('#beam').setAttribute('transform','rotate(0 120 108)');$('#note').textContent=error<12?'אות נעול · '+Math.min(100,Math.floor(hold/2*100))+'%':'עוצמת אות: '+Math.max(0,Math.round(100-error/1.8))+'%';if(now-beepAt>180+error*9){tone(450+(180-error)*4);beepAt=now}if(hold>=2){score+=300;setPhase('lock')}}else if(phase==='lock'){$('#rings').innerHTML=rings.map((v,i)=>'<circle cx="120" cy="108" r="'+(82-i*23)+'" fill="none" stroke="'+(i<ring?'#4c8c79':i===ring?'#ffcf67':'#62ddc3')+'" stroke-width="'+(i===ring?9:4)+'" stroke-dasharray="'+((82-i*23)*Math.PI*2-24)+' 24" transform="rotate('+(v-90+9)+' 120 108)"/>').join('');$('#ringNumber').textContent=(ring+1)+'/3'}else if(phase==='steady'){const stable=!live||!baseline||(Math.abs(wrap(latest.a-baseline.a))<5&&Math.abs(latest.b-baseline.b)<5);hold=stable?hold+dt:0;if(!stable)baseline=latest;$('#note').textContent=(live?'יציבות: ':'תרגול מקלדת — ללא אימות תנועת ראש: ')+Math.min(100,Math.floor(hold/5*100))+'%';$('#scan').setAttribute('transform','translate(0 '+(Math.sin(now/500)*75+75)+')');if(hold>=5){score+=500;finish(true)}}}$('#clock').textContent=Math.floor(Math.ceil(remaining)/60).toString().padStart(2,'0')+':'+(Math.ceil(remaining)%60).toString().padStart(2,'0');$('#score').textContent=String(score).padStart(4,'0');$('#progress i').style.width=(phase==='signal'?hold/2*33:phase==='lock'?33+ring*11:phase==='steady'?66+hold/5*34:phase==='win'?100:0)+'%';requestAnimationFrame(tick)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&['signal','lock','steady'].includes(phase)){e.preventDefault();move(e.key==='ArrowLeft'||e.key==='ArrowDown'?-15:15)}if(e.key==='Enter'&&phase==='lock'){e.preventDefault();if(!e.repeat)confirmRing()}if(e.key.toLowerCase()==='p'||e.key==='Escape'){e.preventDefault();togglePause()}});
view.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragX=e.clientX;view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(dragX===null||phase!=='lock')return;const delta=e.clientX-dragX;if(Math.abs(delta)>8){move(delta>0?15:-15);dragX=e.clientX}});view.addEventListener('pointerup',()=>dragX=null);view.addEventListener('pointercancel',()=>dragX=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)togglePause()});$('#pause').onclick=togglePause;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'צליל: מושתק':'צליל: פעיל'};
home();requestAnimationFrame(tick);
</script>
</html>
